name: Scrape Estado Diario TCE

on:
  schedule:
    # 13:00 UTC ≈ 10:00 / 09:00 hora de Chile (según horario de verano).
    # Ajusta la hora si quieres que corra en otro momento del día.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar scraper
        id: scrape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py

      - name: Commitear datos actualizados
        if: steps.scrape.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Actualiza Estado Diario $(date -u +%Y-%m-%d)" || echo "Nada que commitear"
          git push

      - name: Enviar correo de aviso
        if: steps.scrape.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Nuevo Estado Diario - Tribunal Calificador de Elecciones"
          to: ${{ secrets.MAIL_TO }}
          from: "Estado Diario Bot <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Se detectaron cambios en el Estado Diario del Tribunal Calificador de Elecciones.

            ${{ steps.scrape.outputs.summary }}

            Fuente: https://tricel.lexsoft.cl/tce/estadoDiario
            Página del proyecto: https://jorgelaciarts.github.io/Tricel/

            Este es un mensaje automático.
